services:
  database:
    image: postgres:18-alpine
    container_name: postgres_db
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/posgresql
    networks:
      - system_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d system_db"]
      interval: 2s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
    container_name: java_app
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - system_network

  gateway:
    image: nginx:alpine
    container_name: gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - system_network
volumes:
  pg_data:

networks:
  system_network:
    driver: bridge